[project]
name = "leadx"
version = "0.1.0"
description = "LSH ensemble classifier - fast seed-based classification on large data"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadx"]

[tool.pytest.ini_options]
markers = ["slow: long-running scale tests (deselect with '-m \"not slow\"')"]
