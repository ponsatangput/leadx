[project]
name = "leadx"
version = "0.5.0"
description = "Rare-event and fraud retrieval from a handful of confirmed positives - PU-native density-ratio scoring (LSH / rpTree / MinHash) with an XGBoost-shaped API"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Ponpiboon Satangput" }]
keywords = ["positive-unlabeled", "PU-learning", "LSH", "rare-event", "imbalanced", "retrieval", "random-projection"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "polars>=1.0",
    "scikit-learn>=1.4",
]

[project.urls]
Repository = "https://github.com/ponsatangput/leadx"
Issues = "https://github.com/ponsatangput/leadx/issues"

[dependency-groups]
dev = [
    "pytest>=8",
    "scipy>=1.17.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/leadx"]

[tool.pytest.ini_options]
markers = ["slow: long-running scale tests (deselect with '-m \"not slow\"')"]
